<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

    <div class="registro-contenedor">
    <h2>Hola</h2>

    <div class="inputs-registro">

        <input type="text" id="nombre-registro" placeholder="ej.username123" required minlength="3">
        <input type="email" id="email-registro" placeholder="example@gmail.com" required>
        <input type="password" id="contraseña-registro" placeholder="ej.123456" required>

        <button id="boton-registro">Registrarse</button>
        
        <a href="login.html" id="Login">¿Ya tienes una cuenta?</a>
    </div>
  </div>

  <script src="../js/registro.js"></script>

</body>
</html>
